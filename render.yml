services:
  - type: pserv
    name: hermes-postgres
    env: docker
    image:
      url: timescale/timescaledb:latest-pg15
    plan: starter
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
    envVars:
      - key: POSTGRES_DB
        value: hermes_observability
      - key: POSTGRES_USER
        value: hermes
      - key: POSTGRES_PASSWORD
        generateValue: true

  - type: pserv
    name: hermes-redis
    env: docker
    image:
      url: redis:7-alpine
    plan: free
    disk:
      name: redis-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: hermes-collector
    env: docker
    dockerfilePath: docker/Dockerfile.collector
    dockerContext: .
    plan: free
    envVars:
      - key: REDIS_HOST
        value: hermes-redis
      - key: REDIS_PORT
        value: 6379
      - key: COLLECTOR_PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: COLLECTOR_API_KEYS
        generateValue: true

  - type: worker
    name: hermes-processor
    env: docker
    dockerfilePath: docker/Dockerfile.processor
    dockerContext: .
    plan: free
    envVars:
      - key: POSTGRES_HOST
        value: hermes-postgres
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        value: hermes_observability
      - key: POSTGRES_USER
        value: hermes
      - key: POSTGRES_PASSWORD
        fromService:
          type: pserv
          name: hermes-postgres
          property: envVar:POSTGRES_PASSWORD
      - key: REDIS_HOST
        value: hermes-redis
      - key: REDIS_PORT
        value: 6379
      - key: NODE_ENV
        value: production

  - type: web
    name: hermes-api
    env: docker
    dockerfilePath: docker/Dockerfile.api
    dockerContext: .
    plan: free
    envVars:
      - key: POSTGRES_HOST
        value: hermes-postgres
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        value: hermes_observability
      - key: POSTGRES_USER
        value: hermes
      - key: POSTGRES_PASSWORD
        fromService:
          type: pserv
          name: hermes-postgres
          property: envVar:POSTGRES_PASSWORD
      - key: REDIS_HOST
        value: hermes-redis
      - key: REDIS_PORT
        value: 6379
      - key: API_PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: API_ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: hermes-ui
          property: url

  - type: web
    name: hermes-ui
    env: docker
    dockerfilePath: docker/Dockerfile.ui
    dockerContext: .
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hermes-api
          property: url
      - key: API_ADMIN_TOKEN
        fromService:
          type: web
          name: hermes-api
          property: envVar:API_ADMIN_TOKEN
