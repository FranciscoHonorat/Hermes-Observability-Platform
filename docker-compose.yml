services:
  # PostgreSQL with TimescaleDB Extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: hermes-postgres
    environment:
      POSTGRES_DB: hermes_observability
      POSTGRES_USER: hermes
      # Dev-only credential for local Compose. Never reuse this value outside
      # this file — production deployments (see render.yml) must generate or
      # inject a real secret instead.
      POSTGRES_PASSWORD: hermes_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hermes-network

  # Redis for caching and streaming
  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hermes-network

  # The three Go services (packages/backend) share one image; `command`
  # picks the binary. Built once, tagged hermes-backend.

  # Collector: receives telemetry from agents, queues it on Redis Streams.
  collector:
    build: &backend-build
      context: .
      dockerfile: docker/Dockerfile.backend
    image: hermes-backend
    command: ["/collector"]
    container_name: hermes-collector
    ports:
      - "4000:4000"
    environment:
      HERMES_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COLLECTOR_PORT: 4000
      # Agents reach the collector directly (no proxy), so ignore
      # X-Forwarded-For when rate limiting. Use 1 behind a load balancer.
      TRUSTED_PROXY_HOPS: 0
      # No key configured -> unauthenticated dev requests are attributed to
      # the fixed "default" tenant (id=1, seeded by docker/init-db.sql).
      # Create a real per-tenant key in the UI's Admin page to test the auth
      # path locally. See docs/adr/0002-*.md.
      # Overridable for load testing: RATE_LIMIT_MAX=100000 docker-compose up -d
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hermes-network
    restart: unless-stopped

  # Processor: drains the streams into TimescaleDB and runs the alert
  # engine. GET :4010/healthz reports per-stream backlog (lag/pending).
  processor:
    build: *backend-build
    image: hermes-backend
    command: ["/processor"]
    container_name: hermes-processor
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: hermes_observability
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Stable name so a restarted container resumes its own pending entries
      # immediately. Give each replica a distinct name if you scale this out.
      PROCESSOR_CONSUMER_NAME: processor-1
    ports:
      - "4010:4010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hermes-network
    restart: unless-stopped

  # Hermes Intelligence (anomaly detection + performance recommendations)
  intelligence:
    build:
      context: .
      dockerfile: packages/intelligence/Dockerfile
    container_name: hermes-intelligence
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: hermes_observability
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes_dev_password
      ANOMALY_CHECK_INTERVAL_SECONDS: "300"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hermes-network
    restart: unless-stopped

  # API: dashboard queries, sessions (signup/login) and tenant admin
  # (users, collector API keys). Replaces the former api, users and admin
  # services; see docs/adr/0003-*.md.
  api:
    build: *backend-build
    image: hermes-backend
    command: ["/api"]
    container_name: hermes-api
    ports:
      - "3000:3000"
    environment:
      HERMES_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: hermes_observability
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 3000
      CORS_ORIGIN: "http://localhost:3001"
      # Dev-only secret signing session JWTs. Never reuse this value outside
      # this file. See docs/adr/0002-*.md.
      JWT_SECRET: hermes_dev_jwt_secret_change_in_production
      # Overridable for load testing: RATE_LIMIT_MAX=100000 docker-compose up -d
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hermes-network
    restart: unless-stopped

  # Hermes UI (React dashboard)
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: hermes-ui
    ports:
      - "3001:80"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    networks:
      - hermes-network
    restart: unless-stopped

networks:
  hermes-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
